<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>4K 60fps 演唱會 HEVC 影片剪輯工具</title>
    <style>
        :root {
            --primary: #ff2d55;
            --bg: #0f0f13;
            --card-bg: #1a1a24;
            --text: #ffffff;
            --text-secondary: #a0a0b0;
            --border: #2c2c3e;
            --accent-yellow: #ffcc00;
            --guide-line: #00f0ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
        body { background: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; user-select: none; -webkit-user-select: none; }
        h1 { font-size: 20px; margin-bottom: 4px; text-align: center; color: var(--primary); }
        .subtitle { font-size: 12px; color: var(--text-secondary); text-align: center; margin-bottom: 16px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .card h2 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
        input[type="text"], select { width: 100%; padding: 10px; background: #12121a; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; margin-bottom: 12px; }
        input[type="range"] { width: 100%; accent-color: var(--primary); margin-bottom: 6px; }
        .file-upload-btn { display: block; width: 100%; padding: 14px; background: #252536; border: 2px dashed var(--primary); border-radius: 12px; text-align: center; color: var(--text); font-weight: 600; cursor: pointer; margin-bottom: 8px; }
        .btn { display: block; width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; }
        .btn:disabled { background: #3a3a4f; color: var(--text-secondary); cursor: not-allowed; }
        
        .video-item-card { background: #12121a; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
        .video-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 10px; word-break: break-all; }
        
        /* 9:16 預覽區域 */
        .preview-wrapper { position: relative; width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 10px; touch-action: none; }
        .preview-canvas { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .drag-hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 11px; pointer-events: none; opacity: 0.8; z-index: 5; }
        
        /* iOS 風格時間軸 & 縮圖膠卷 */
        .ios-trimmer-container { background: #1a1a24; padding: 12px 10px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 12px; }
        .trimmer-track { position: relative; height: 50px; background: #2a2a3a; border-radius: 6px; overflow: hidden; display: flex; align-items: center; }
        .filmstrip-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; opacity: 0.7; pointer-events: none; }
        .filmstrip-thumb { flex: 1; height: 100%; object-fit: cover; border-right: 1px solid rgba(0,0,0,0.3); }
        
        /* 播放進度指標 (Playhead) */
        .playhead-marker { position: absolute; top: 0; width: 3px; height: 100%; background: #ffffff; box-shadow: 0 0 4px rgba(0,0,0,0.8); pointer-events: none; z-index: 8; transform: translateX(-50%); }
        .playhead-marker::before { content: ""; position: absolute; top: -2px; left: 50%; transform: translateX(-50%); border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 6px solid #fff; }

        .trim-selection { position: absolute; top: 0; height: 100%; background: rgba(255, 204, 0, 0.25); border-top: 3px solid var(--accent-yellow); border-bottom: 3px solid var(--accent-yellow); box-sizing: border-box; }
        .handle { position: absolute; top: 0; width: 16px; height: 100%; background: var(--accent-yellow); display: flex; align-items: center; justify-content: center; cursor: ew-resize; touch-action: none; z-index: 10; border-radius: 2px; }
        .handle::after { content: "||"; font-size: 10px; color: #000; font-weight: bold; }
        .handle-left { left: 0; border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
        .handle-right { right: 0; border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
        
        .trim-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
        .play-control-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
        .play-btn { background: #2c2c3e; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .sound-btn { background: #2c2c3e; color: #fff; border: none; padding: 8px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        
        .progress-box { margin-top: 12px; display: none; }
        .progress-bar-bg { width: 100%; height: 8px; background: #12121a; border-radius: 4px; overflow: hidden; margin-top: 6px; }
        .progress-bar-fill { width: 0%; height: 100%; background: var(--primary); transition: width 0.2s; }
        .status-text { font-size: 12px; color: var(--text-secondary); margin-top: 6px; text-align: right; }
        .download-item { background: #12121a; padding: 10px 14px; border-radius: 8px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
        .download-item span { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
        .download-btn { background: #28a745; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>

    <h1>✨ 演唱會 4K HEVC 影片工具</h1>
    <div class="subtitle">HEVC(H.265) 輸出 ｜ 音訊預覽 ｜ 縮圖膠卷與 IG 磁吸對齊線</div>

    <!-- 步驟 1：選擇影片 -->
    <div class="card">
        <h2>📁 1. 選擇 4K 影片 (可多選)</h2>
        <label class="file-upload-btn" for="videoInput">點此從手機相簿選取影片</label>
        <input type="file" id="videoInput" accept="video/*" multiple style="display: none;">
        <div id="fileSummary" style="font-size: 13px; color: var(--text-secondary);">尚未選擇檔案</div>
    </div>

    <!-- 全局樣式設定 -->
    <div class="card">
        <h2>⚙️ 浮水印樣式設定 (自動記憶)</h2>
        <label>透明度 (<span id="opacityVal">80</span>%)</label>
        <input type="range" id="globalOpacity" min="10" max="100" value="80" oninput="document.getElementById('opacityVal').innerText=this.value; saveSettings(); updateAllPreviews();">

        <label>字體大小 (<span id="sizeVal">24</span>px)</label>
        <input type="range" id="globalSize" min="12" max="60" value="24" oninput="document.getElementById('sizeVal').innerText=this.value; saveSettings(); updateAllPreviews();">
    </div>

    <!-- 步驟 2：影片編輯卡片 -->
    <div class="card" id="videoCardsContainer" style="display: none;">
        <h2>✂️ 2. 縮圖膠卷剪輯與 IG 磁吸浮水印</h2>
        <div id="cardsList"></div>
    </div>

    <!-- 步驟 3：開始輸出 -->
    <div class="card">
        <h2>🚀 3. HEVC 高畫質輸出與下載</h2>
        <button id="processBtn" class="btn" disabled>開始製作 HEVC 影片</button>
        
        <div id="progressBox" class="progress-box">
            <div id="progressStatus" style="font-size: 13px;">準備處理...</div>
            <div class="progress-bar-bg">
                <div id="progressBarFill" class="progress-bar-fill"></div>
            </div>
            <div id="progressPercent" class="status-text">0%</div>
        </div>

        <div id="downloadContainer" style="margin-top: 14px;"></div>
    </div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const fileSummary = document.getElementById('fileSummary');
        const videoCardsContainer = document.getElementById('videoCardsContainer');
        const cardsList = document.getElementById('cardsList');
        const processBtn = document.getElementById('processBtn');
        const progressBox = document.getElementById('progressBox');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressStatus = document.getElementById('progressStatus');
        const progressPercent = document.getElementById('progressPercent');
        const downloadContainer = document.getElementById('downloadContainer');

        let videoProjects = [];
        let watermarkNormalizedPos = { x: 0.5, y: 0.88 }; // 預設下方居中
        let isDraggingWM = false;
        let activeSnapLines = { xCenter: false, yCenter: false };

        window.addEventListener('DOMContentLoaded', () => {
            const savedOpacity = localStorage.getItem('wm_opacity');
            const savedSize = localStorage.getItem('wm_size');
            const savedPosX = localStorage.getItem('wm_pos_x');
            const savedPosY = localStorage.getItem('wm_pos_y');

            if (savedOpacity) {
                document.getElementById('globalOpacity').value = savedOpacity;
                document.getElementById('opacityVal').innerText = savedOpacity;
            }
            if (savedSize) {
                document.getElementById('globalSize').value = savedSize;
                document.getElementById('sizeVal').innerText = savedSize;
            }
            if (savedPosX !== null && savedPosY !== null) {
                watermarkNormalizedPos.x = parseFloat(savedPosX);
                watermarkNormalizedPos.y = parseFloat(savedPosY);
            }
        });

        function saveSettings() {
            localStorage.setItem('wm_opacity', document.getElementById('globalOpacity').value);
            localStorage.setItem('wm_size', document.getElementById('globalSize').value);
            localStorage.setItem('wm_pos_x', watermarkNormalizedPos.x);
            localStorage.setItem('wm_pos_y', watermarkNormalizedPos.y);
        }

        videoInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            fileSummary.innerText = `已選擇 ${files.length} 個影片檔案`;
            videoCardsContainer.style.display = 'block';
            cardsList.innerHTML = '';
            videoProjects = [];

            files.forEach((file, index) => {
                const project = {
                    id: index,
                    file: file,
                    videoEl: document.createElement('video'),
                    canvas: null,
                    ctx: null,
                    wrapper: null,
                    startTime: 0,
                    endTime: 0,
                    duration: 0,
                    isPlaying: false,
                    isMuted: false,
                    animFrame: null
                };

                project.videoEl.src = URL.createObjectURL(file);
                project.videoEl.muted = false; // 預設開啟音訊能力
                project.videoEl.playsInline = true;
                project.videoEl.preload = 'auto';

                const cardDiv = document.createElement('div');
                cardDiv.className = 'video-item-card';
                cardDiv.innerHTML = `
                    <div class="video-title">🎥 ${file.name}</div>
                    
                    <div class="preview-wrapper" id="wrapper_${index}">
                        <div class="drag-hint">🖐️ 拖曳浮水印（接近中心自動貼齊對齊線）</div>
                        <canvas class="preview-canvas" id="canvas_${index}"></canvas>
                    </div>

                    <label>浮水印文字內容</label>
                    <select id="preset_${index}">
                        <option value="boice114forever">boice114forever</option>
                        <option value="joyce8651">joyce8651</option>
                    </select>

                    <div class="ios-trimmer-container">
                        <div class="trimmer-track" id="track_${index}">
                            <div class="filmstrip-container" id="filmstrip_${index}"></div>
                            <div class="playhead-marker" id="playhead_${index}" style="left: 0%;"></div>
                            <div class="trim-selection" id="selection_${index}">
                                <div class="handle handle-left" id="h_left_${index}"></div>
                                <div class="handle handle-right" id="h_right_${index}"></div>
                            </div>
                        </div>
                        <div class="trim-info">
                            <span id="time_start_${index}">0.0s</span>
                            <span id="time_duration_${index}">長度: 0.0s</span>
                            <span id="time_end_${index}">0.0s</span>
                        </div>
                        <div class="play-control-bar">
                            <button class="play-btn" id="play_btn_${index}">▶️ 預覽播放 (聲音開啟)</button>
                            <button class="sound-btn" id="sound_btn_${index}">🔊 聲音: 開</button>
                        </div>
                    </div>
                `;
                cardsList.appendChild(cardDiv);

                project.wrapper = cardDiv.querySelector(`#wrapper_${index}`);
                project.canvas = cardDiv.querySelector(`#canvas_${index}`);
                project.ctx = project.canvas.getContext('2d');

                setupDragWatermarkWithSnapping(project);

                project.videoEl.onloadedmetadata = () => {
                    project.duration = project.videoEl.duration;
                    project.endTime = project.duration;
                    project.canvas.width = 1080;
                    project.canvas.height = 1920;

                    generateFilmstrip(project, cardDiv.querySelector(`#filmstrip_${index}`));
                    setupIOSTrimmer(project, cardDiv);

                    project.videoEl.currentTime = 0.05;
                };

                project.videoEl.onseeked = () => drawProjectPreview(project);

                cardDiv.querySelector(`#preset_${index}`).onchange = () => drawProjectPreview(project);

                // 音量與播放控制
                const playBtn = cardDiv.querySelector(`#play_btn_${index}`);
                const soundBtn = cardDiv.querySelector(`#sound_btn_${index}`);

                playBtn.onclick = () => togglePlayProject(project, cardDiv);
                soundBtn.onclick = () => {
                    project.isMuted = !project.isMuted;
                    project.videoEl.muted = project.isMuted;
                    soundBtn.innerText = project.isMuted ? '🔇 聲音: 靜音' : '🔊 聲音: 開';
                };

                videoProjects.push(project);
            });

            processBtn.disabled = false;
        });

        // 生成縮圖膠卷 (Filmstrip Thumbnails)
        function generateFilmstrip(project, containerEl) {
            const count = 6;
            containerEl.innerHTML = '';
            const tempVid = document.createElement('video');
            tempVid.src = project.videoEl.src;
            tempVid.muted = true;
            tempVid.playsInline = true;

            tempVid.onloadeddata = async () => {
                const interval = project.duration / count;
                for (let i = 0; i < count; i++) {
                    tempVid.currentTime = i * interval + 0.1;
                    await new Promise(r => tempVid.onseeked = r);
                    
                    const cvs = document.createElement('canvas');
                    cvs.width = 100;
                    cvs.height = 100;
                    const c = cvs.getContext('2d');
                    c.drawImage(tempVid, 0, 0, 100, 100);
                    
                    const img = document.createElement('img');
                    img.className = 'filmstrip-thumb';
                    img.src = cvs.toDataURL('image/jpeg', 0.5);
                    containerEl.appendChild(img);
                }
            };
        }

        // 手指拖曳與 IG 磁吸輔助線 (Snap Lines)
        function setupDragWatermarkWithSnapping(project) {
            const handleMove = (clientX, clientY) => {
                if (!isDraggingWM) return;
                const rect = project.wrapper.getBoundingClientRect();
                let rawX = (clientX - rect.left) / rect.width;
                let rawY = (clientY - rect.top) / rect.height;

                // IG 磁吸邏輯 (吸附中心 0.5)
                const snapThreshold = 0.03;
                activeSnapLines.xCenter = false;
                activeSnapLines.yCenter = false;

                if (Math.abs(rawX - 0.5) < snapThreshold) {
                    rawX = 0.5;
                    activeSnapLines.xCenter = true;
                }
                if (Math.abs(rawY - 0.5) < snapThreshold) {
                    rawY = 0.5;
                    activeSnapLines.yCenter = true;
                }

                watermarkNormalizedPos.x = Math.max(0.05, Math.min(0.95, rawX));
                watermarkNormalizedPos.y = Math.max(0.05, Math.min(0.95, rawY));

                saveSettings();
                updateAllPreviews();
            };

            project.wrapper.addEventListener('touchstart', (e) => {
                isDraggingWM = true;
                handleMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });

            project.wrapper.addEventListener('touchmove', (e) => {
                handleMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });

            window.addEventListener('touchend', () => {
                isDraggingWM = false;
                activeSnapLines = { xCenter: false, yCenter: false };
                updateAllPreviews();
            });

            project.wrapper.addEventListener('mousedown', (e) => {
                isDraggingWM = true;
                handleMove(e.clientX, e.clientY);
            });

            window.addEventListener('mousemove', (e) => {
                if (isDraggingWM) handleMove(e.clientX, e.clientY);
            });

            window.addEventListener('mouseup', () => {
                isDraggingWM = false;
                activeSnapLines = { xCenter: false, yCenter: false };
                updateAllPreviews();
            });
        }

        // iOS Trimmer & 播放浮標
        function setupIOSTrimmer(project, cardDiv) {
            const track = cardDiv.querySelector(`#track_${project.id}`);
            const selection = cardDiv.querySelector(`#selection_${project.id}`);
            const hLeft = cardDiv.querySelector(`#h_left_${project.id}`);
            const hRight = cardDiv.querySelector(`#h_right_${project.id}`);
            const playhead = cardDiv.querySelector(`#playhead_${project.id}`);

            const tStart = cardDiv.querySelector(`#time_start_${project.id}`);
            const tEnd = cardDiv.querySelector(`#time_end_${project.id}`);
            const tDur = cardDiv.querySelector(`#time_duration_${project.id}`);

            let trackWidth = track.clientWidth || 280;
            let leftPx = 0;
            let rightPx = trackWidth;

            const updateUI = () => {
                selection.style.left = leftPx + 'px';
                selection.style.width = (rightPx - leftPx) + 'px';

                project.startTime = (leftPx / trackWidth) * project.duration;
                project.endTime = (rightPx / trackWidth) * project.duration;

                tStart.innerText = project.startTime.toFixed(1) + 's';
                tEnd.innerText = project.endTime.toFixed(1) + 's';
                tDur.innerText = '長度: ' + (project.endTime - project.startTime).toFixed(1) + 's';

                const curPercent = (project.videoEl.currentTime / project.duration) * 100;
                playhead.style.left = curPercent + '%';
            };

            updateUI();

            project.videoEl.addEventListener('timeupdate', () => {
                const curPercent = (project.videoEl.currentTime / project.duration) * 100;
                playhead.style.left = curPercent + '%';
            });

            let activeHandle = null;

            const onStart = (e) => {
                if (e.target === hLeft) activeHandle = 'left';
                else if (e.target === hRight) activeHandle = 'right';
            };

            const onMove = (e) => {
                if (!activeHandle) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const rect = track.getBoundingClientRect();
                let offsetX = clientX - rect.left;
                offsetX = Math.max(0, Math.min(rect.width, offsetX));

                const minPx = 15;

                if (activeHandle === 'left') {
                    if (offsetX < rightPx - minPx) leftPx = offsetX;
                    project.videoEl.currentTime = (leftPx / rect.width) * project.duration;
                } else if (activeHandle === 'right') {
                    if (offsetX > leftPx + minPx) rightPx = offsetX;
                    project.videoEl.currentTime = (rightPx / rect.width) * project.duration;
                }

                trackWidth = rect.width;
                updateUI();
            };

            const onEnd = () => {
                if (activeHandle) {
                    activeHandle = null;
                    drawProjectPreview(project);
                }
            };

            hLeft.addEventListener('touchstart', onStart, { passive: true });
            hRight.addEventListener('touchstart', onStart, { passive: true });
            window.addEventListener('touchmove', onMove, { passive: true });
            window.addEventListener('touchend', onEnd);

            hLeft.addEventListener('mousedown', onStart);
            hRight.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
        }

        function togglePlayProject(project, cardDiv) {
            const playBtn = cardDiv.querySelector(`#play_btn_${project.id}`);

            if (project.isPlaying) {
                project.videoEl.pause();
                project.isPlaying = false;
                playBtn.innerText = '▶️ 預覽播放 (聲音開啟)';
                if (project.animFrame) cancelAnimationFrame(project.animFrame);
            } else {
                if (project.videoEl.currentTime < project.startTime || project.videoEl.currentTime >= project.endTime) {
                    project.videoEl.currentTime = project.startTime;
                }
                project.videoEl.play();
                project.isPlaying = true;
                playBtn.innerText = '⏸️ 暫停預覽';

                const loop = () => {
                    if (!project.isPlaying) return;
                    if (project.videoEl.currentTime >= project.endTime) {
                        project.videoEl.pause();
                        project.isPlaying = false;
                        playBtn.innerText = '▶️ 預覽播放 (聲音開啟)';
                        project.videoEl.currentTime = project.startTime;
                        return;
                    }
                    drawProjectPreview(project);
                    project.animFrame = requestAnimationFrame(loop);
                };
                loop();
            }
        }

        // 畫布預覽（包含 IG 風格對齊線）
        function drawProjectPreview(project) {
            const targetWidth = 1080;
            const targetHeight = 1920;
            const ctx = project.ctx;

            ctx.clearRect(0, 0, targetWidth, targetHeight);
            ctx.fillStyle = '#12121a';
            ctx.fillRect(0, 0, targetWidth, targetHeight);

            if (project.videoEl.readyState >= 1) {
                const srcW = project.videoEl.videoWidth || 1080;
                const srcH = project.videoEl.videoHeight || 1920;
                const sAspect = srcW / srcH;
                const tAspect = 9 / 16;
                let sw = srcW, sh = srcH, sx = 0, sy = 0;

                if (sAspect > tAspect) {
                    sw = srcH * tAspect;
                    sx = (srcW - sw) / 2;
                } else {
                    sh = srcW / tAspect;
                    sy = (srcH - sh) / 2;
                }
                ctx.drawImage(project.videoEl, sx, sy, sw, sh, 0, 0, targetWidth, targetHeight);
            }

            // 拖曳時顯示 IG 風格輔助線與磁吸線
            if (isDraggingWM) {
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 8]);

                // 垂直中心線
                if (activeSnapLines.xCenter) {
                    ctx.strokeStyle = '#ff2d55';
                    ctx.lineWidth = 4;
                    ctx.setLineDash([]);
                } else {
                    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                }
                ctx.beginPath();
                ctx.moveTo(targetWidth / 2, 0);
                ctx.lineTo(targetWidth / 2, targetHeight);
                ctx.stroke();

                // 水平中心線
                if (activeSnapLines.yCenter) {
                    ctx.strokeStyle = '#ff2d55';
                    ctx.lineWidth = 4;
                    ctx.setLineDash([]);
                } else {
                    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                }
                ctx.beginPath();
                ctx.moveTo(0, targetHeight / 2);
                ctx.lineTo(targetWidth, targetHeight / 2);
                ctx.stroke();

                ctx.setLineDash([]);
            }

            // 繪製浮水印
            const cardDiv = cardsList.children[project.id];
            if (!cardDiv) return;
            const text = cardDiv.querySelector(`#preset_${project.id}`).value;
            const opacity = document.getElementById('globalOpacity').value / 100;
            const fontSize = parseInt(document.getElementById('globalSize').value);

            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.font = `bold ${fontSize * (targetHeight / 1080)}px sans-serif`;
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 8;

            const metrics = ctx.measureText(text);
            const textWidth = metrics.width;

            let posX = targetWidth * watermarkNormalizedPos.x - (textWidth / 2);
            let posY = targetHeight * watermarkNormalizedPos.y;

            posX = Math.max(20, Math.min(targetWidth - textWidth - 20, posX));
            posY = Math.max(60, Math.min(targetHeight - 30, posY));

            ctx.fillText(text, posX, posY);
            ctx.restore();
        }

        function updateAllPreviews() {
            videoProjects.forEach(p => drawProjectPreview(p));
        }

        // 優先嘗試 HEVC (H.265) 編碼器輸出
        function getSupportedHEVCBitrate() {
            const types = [
                'video/mp4;codecs=hevc,mp4a.40.2',
                'video/mp4;codecs=h265,mp4a.40.2',
                'video/webm;codecs=vp9,opus',
                'video/mp4',
                'video/webm'
            ];
            for (let t of types) {
                if (MediaRecorder.isTypeSupported(t)) return t;
            }
            return '';
        }

        processBtn.addEventListener('click', async () => {
            if (videoProjects.length === 0) return;

            processBtn.disabled = true;
            progressBox.style.display = 'block';

            const opacity = document.getElementById('globalOpacity').value / 100;
            const fontSize = parseInt(document.getElementById('globalSize').value);

            for (let i = 0; i < videoProjects.length; i++) {
                const p = videoProjects[i];
                const cardDiv = cardsList.children[p.id];
                const text = cardDiv.querySelector(`#preset_${p.id}`).value;

                progressStatus.innerText = `正在輸出 HEVC (${i + 1}/${videoProjects.length}): ${p.file.name}`;

                try {
                    await processSingleVideo(p, text, opacity, fontSize, (progress) => {
                        const percent = Math.round(progress * 100);
                        progressBarFill.style.width = `${percent}%`;
                        progressPercent.innerText = `${percent}%`;
                    }, (url, name) => {
                        const item = document.createElement('div');
                        item.className = 'download-item';
                        item.innerHTML = `<span>✅ ${name} (HEVC)</span><a class="download-btn" href="${url}" download="${name}">立即下載</a>`;
                        downloadContainer.appendChild(item);
                    });
                } catch (err) {
                    console.log(err);
                    alert(`處理 ${p.file.name} 失敗。`);
                }
            }

            progressStatus.innerText = "全部 HEVC 影片處理完成！";
            processBtn.disabled = false;
        });

        function processSingleVideo(p, text, opacity, fontSize, onProgress, onComplete) {
            return new Promise((resolve, reject) => {
                const video = p.videoEl;
                const srcWidth = video.videoWidth;
                const srcHeight = video.videoHeight;
                const startTime = p.startTime;
                const endTime = p.endTime;

                const canvas = document.createElement('canvas');
                canvas.width = 1080;
                canvas.height = 1920;
                const ctx = canvas.getContext('2d');

                const stream = canvas.captureStream(60);
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioCtx.createMediaElementSource(video);
                    const dest = audioCtx.createMediaStreamDestination();
                    source.connect(dest);
                    source.connect(audioCtx.destination);
                    if (dest.stream.getAudioTracks().length > 0) {
                        stream.addTrack(dest.stream.getAudioTracks()[0]);
                    }
                } catch (e) { console.log("音訊擷取略過", e); }

                const mimeType = getSupportedHEVCBitrate();
                const mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType, videoBitsPerSecond: 45000000 } : {});
                const chunks = [];

                mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    const url = URL.createObjectURL(blob);
                    const outName = `HEVC_watermarked_${p.file.name.replace(/\.[^/.]+$/, "")}.mp4`;
                    onComplete(url, outName);
                    resolve();
                };

                video.currentTime = startTime;
                video.onseeked = () => {
                    mediaRecorder.start();
                    video.play();

                    function drawFrame() {
                        if (video.paused || video.ended || video.currentTime >= endTime) {
                            video.pause();
                            if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                            return;
                        }

                        const sAspect = srcWidth / srcHeight;
                        const tAspect = 9 / 16;
                        let sw = srcWidth, sh = srcHeight, sx = 0, sy = 0;

                        if (sAspect > tAspect) {
                            sw = srcHeight * tAspect;
                            sx = (srcWidth - sw) / 2;
                        } else {
                            sh = srcWidth / tAspect;
                            sy = (srcHeight - sh) / 2;
                        }

                        ctx.clearRect(0, 0, 1080, 1920);
                        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, 1080, 1920);

                        ctx.save();
                        ctx.globalAlpha = opacity;
                        ctx.font = `bold ${fontSize * (1920 / 1080)}px sans-serif`;
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                        ctx.shadowBlur = 8;

                        const metrics = ctx.measureText(text);
                        const textWidth = metrics.width;

                        let posX = 1080 * watermarkNormalizedPos.x - (textWidth / 2);
                        let posY = 1920 * watermarkNormalizedPos.y;

                        posX = Math.max(20, Math.min(1080 - textWidth - 20, posX));
                        posY = Math.max(60, Math.min(1920 - 30, posY));

                        ctx.fillText(text, posX, posY);
                        ctx.restore();

                        const progress = (video.currentTime - startTime) / (endTime - startTime);
                        onProgress(Math.min(Math.max(progress, 0), 1));
                        requestAnimationFrame(drawFrame);
                    }

                    drawFrame();
                };
            });
        }
    </script>
